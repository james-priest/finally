[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend: FastAPI, market data, portfolio, chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "massive>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"   # async test functions run without decorators
pythonpath = ["."]      # lets tests import app
testpaths = ["tests"]
