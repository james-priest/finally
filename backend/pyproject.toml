[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend: FastAPI, market data, portfolio, chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "massive>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"   # async test functions run without decorators
pythonpath = ["."]      # lets tests import app
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["massive.*"]  # the client ships no type information (no py.typed)
ignore_missing_imports = true
